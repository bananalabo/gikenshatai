<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>BP Connect — Page Flow / ページフロー</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #1d4ed8;
    --brand-soft: #eff6ff;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: var(--ink);
    background: #f1f5f9;
    line-height: 1.6;
  }

  /* ---------- Password gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 1000;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a8a, var(--bg));
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #gate .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    text-align: center;
  }
  #gate .logo {
    font-weight: 800; font-size: 22px; letter-spacing: .2px; color: var(--brand);
  }
  #gate .logo span { color: var(--accent); }
  #gate p { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
  #gate input {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; outline: none; margin-bottom: 12px;
  }
  #gate input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  #gate button {
    width: 100%; padding: 12px 14px; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--brand); border: none; border-radius: 10px; cursor: pointer;
  }
  #gate button:hover { background: #1742c0; }
  #gateError { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .hidden { display: none !important; }

  /* ---------- Page ---------- */
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .title { font-weight: 800; font-size: 18px; color: var(--brand); }
  .title span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; font-weight: 400; }
  .lang-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang-toggle button {
    border: none; background: #fff; color: var(--muted); padding: 8px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--brand); color: #fff; }
  .link-pages {
    font-size: 13px; font-weight: 600; color: var(--brand); text-decoration: none;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    white-space: nowrap;
  }
  .link-pages:hover { background: var(--brand-soft); }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .intro-row {
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px;
  }
  .intro { color: var(--muted); font-size: 14px; margin: 0; flex: 1; }
  section.card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; margin: 18px 0; box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    margin-bottom: 14px;
  }
  .card-head h2 { font-size: 16px; margin: 0; color: var(--ink); line-height: 1.35; flex: 1; }
  .info-btn {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--brand); font-size: 15px; font-weight: 800; font-style: italic;
    font-family: Georgia, "Times New Roman", serif; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(15,23,42,.06);
    transition: background .15s, border-color .15s, color .15s;
  }
  .info-btn:hover, .info-btn:focus-visible {
    background: var(--brand-soft); border-color: var(--brand); outline: none;
  }
  .diagram { overflow-x: auto; }
  .diagram svg { max-width: 100%; height: auto; }
  footer { max-width: 1100px; margin: 0 auto; padding: 8px 24px 48px; color: var(--muted); font-size: 12px; }

  /* Info modal (diagram explanations) */
  #info-modal {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(15,23,42,.5); display: flex; align-items: flex-end; justify-content: center;
    padding: 0; overflow-y: auto;
  }
  @media (min-width: 640px) {
    #info-modal { align-items: center; padding: 24px 16px; }
  }
  #info-modal.hidden { display: none; }
  .info-panel {
    width: 100%; max-width: 520px; background: var(--panel); border-radius: 16px 16px 0 0;
    border: 1px solid var(--line); box-shadow: 0 -8px 32px rgba(0,0,0,.12);
    max-height: min(85vh, 640px); display: flex; flex-direction: column;
  }
  @media (min-width: 640px) {
    .info-panel { border-radius: 16px; max-height: min(80vh, 620px); }
  }
  .info-panel-head {
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0;
  }
  .info-panel-head h3 { margin: 0; font-size: 17px; line-height: 1.3; }
  .info-panel-close {
    border: none; background: #f1f5f9; color: var(--ink); width: 36px; height: 36px;
    border-radius: 10px; font-size: 22px; line-height: 1; cursor: pointer; flex-shrink: 0;
  }
  .info-panel-close:hover { background: #e2e8f0; }
  .info-panel-body {
    padding: 14px 18px 22px; overflow-y: auto; font-size: 14px; line-height: 1.65; color: var(--ink);
  }
  .info-panel-body p { margin: 0 0 12px; }
  .info-panel-body p:last-child { margin-bottom: 0; }
  .info-panel-body ul { margin: 0 0 12px; padding-left: 1.15rem; }
  .info-panel-body li { margin-bottom: 8px; }
  .info-panel-body li:last-child { margin-bottom: 0; }
  .info-panel-body .info-note {
    font-size: 12px; color: var(--muted); margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
  }

  @media (max-width: 640px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- Password gate -->
<div id="gate">
  <div class="card">
    <div class="logo">BP <span>Connect</span></div>
    <p>Enter password to view<br />閲覧パスワードを入力してください</p>
    <input id="gateInput" type="password" autocomplete="off" placeholder="Password / パスワード" />
    <button id="gateBtn">View / 表示</button>
    <div id="gateError"></div>
  </div>
</div>

<!-- Content -->
<div id="content" class="hidden">
  <header>
    <div class="header-inner">
      <div>
        <div class="title">BP <span>Connect</span> — <span class="ttl-text"></span></div>
        <div class="subtitle sub-text"></div>
      </div>
      <div class="header-actions">
        <a class="link-pages" id="linkPages" href="./bpconnect-pages.html">Page list / ページ一覧</a>
        <div class="lang-toggle">
          <button data-lang="ja" class="active">日本語</button>
          <button data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="intro-row">
      <p class="intro intro-text"></p>
      <button type="button" class="info-btn" id="introInfoBtn" data-info-key="intro" aria-expanded="false" title="">i</button>
    </div>

    <section class="card">
      <div class="card-head">
        <h2 id="title-d1"></h2>
        <button type="button" class="info-btn info-diagram" data-info-key="d1" aria-expanded="false" title="">i</button>
      </div>
      <div class="diagram" id="diagram-d1"></div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2 id="title-d2"></h2>
        <button type="button" class="info-btn info-diagram" data-info-key="d2" aria-expanded="false" title="">i</button>
      </div>
      <div class="diagram" id="diagram-d2"></div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2 id="title-d3"></h2>
        <button type="button" class="info-btn info-diagram" data-info-key="d3" aria-expanded="false" title="">i</button>
      </div>
      <div class="diagram" id="diagram-d3"></div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2 id="title-d4"></h2>
        <button type="button" class="info-btn info-diagram" data-info-key="d4" aria-expanded="false" title="">i</button>
      </div>
      <div class="diagram" id="diagram-d4"></div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2 id="title-d5"></h2>
        <button type="button" class="info-btn info-diagram" data-info-key="d5" aria-expanded="false" title="">i</button>
      </div>
      <div class="diagram" id="diagram-d5"></div>
    </section>
  </main>
  <footer class="foot-text"></footer>
</div>

<!-- Explanation modal -->
<div id="info-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
  <div class="info-panel">
    <div class="info-panel-head">
      <h3 id="info-modal-title"></h3>
      <button type="button" class="info-panel-close" id="infoModalClose" aria-label="">×</button>
    </div>
    <div class="info-panel-body" id="info-modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  let currentLang = "ja";

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildExplainHtml(entry, hint) {
    var html = "";
    (entry.paragraphs || []).forEach(function (p) {
      html += "<p>" + escapeHtml(p) + "</p>";
    });
    if (entry.bullets && entry.bullets.length) {
      html += "<ul>";
      entry.bullets.forEach(function (b) {
        html += "<li>" + escapeHtml(b) + "</li>";
      });
      html += "</ul>";
    }
    if (entry.note) {
      html += "<p class=\"info-note\">" + escapeHtml(entry.note) + "</p>";
    }
    if (hint) {
      html += "<p class=\"info-note\">" + escapeHtml(hint) + "</p>";
    }
    return html;
  }

  function updateInfoChrome(t) {
    document.querySelectorAll(".info-btn").forEach(function (btn) {
      btn.setAttribute("title", t.infoBtnTitle);
      btn.setAttribute("aria-label", t.infoBtnTitle);
    });
    document.getElementById("infoModalClose").setAttribute("aria-label", t.ariaCloseInfo);
  }

  function closeInfoModal() {
    document.getElementById("info-modal").classList.add("hidden");
    document.querySelectorAll(".info-btn").forEach(function (btn) {
      btn.setAttribute("aria-expanded", "false");
    });
  }

  function openInfoModal(key) {
    var t = ui[currentLang];
    var entry = t.explain[key];
    if (!entry) return;
    document.getElementById("info-modal-title").textContent = entry.title;
    document.getElementById("info-modal-body").innerHTML = buildExplainHtml(entry, t.modalHint);
    document.getElementById("info-modal").classList.remove("hidden");
    document.querySelectorAll(".info-btn").forEach(function (b) {
      b.setAttribute("aria-expanded", b.getAttribute("data-info-key") === key ? "true" : "false");
    });
    document.getElementById("infoModalClose").focus();
  }

  mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose", flowchart: { htmlLabels: true, curve: "basis" } });

  async function renderAll(lang) {
    closeInfoModal();
    currentLang = lang;
    document.documentElement.lang = lang;
    const t = ui[lang];
    document.querySelector(".ttl-text").textContent = t.title;
    document.querySelector(".sub-text").textContent = t.subtitle;
    document.querySelector(".intro-text").textContent = t.intro;
    document.querySelector(".foot-text").textContent = t.footer;
    var lp = document.getElementById("linkPages");
    if (lp && t.linkPages) lp.textContent = t.linkPages;
    for (const key of ["d1", "d2", "d3", "d4", "d5"]) {
      document.getElementById("title-" + key).textContent = t.titles[key];
      const container = document.getElementById("diagram-" + key);
      const id = "m-" + lang + "-" + key + "-" + Date.now();
      try {
        const { svg } = await mermaid.render(id, diagrams[lang][key]);
        container.innerHTML = svg;
      } catch (e) {
        container.textContent = "diagram error";
      }
    }
    document.querySelectorAll(".lang-toggle button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    updateInfoChrome(t);
  }

  function unlock() {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
    sessionStorage.setItem("bpc_ok", "1");
    renderAll("ja");
  }

  function tryUnlock() {
    const val = document.getElementById("gateInput").value.trim();
    if (val === PASSWORD) {
      unlock();
    } else {
      const err = document.getElementById("gateError");
      err.textContent = "Incorrect password / パスワードが違います";
      document.getElementById("gateInput").select();
    }
  }

  document.getElementById("gateBtn").addEventListener("click", tryUnlock);
  document.getElementById("gateInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });
  document.querySelectorAll(".lang-toggle button").forEach(function (b) {
    b.addEventListener("click", function () { renderAll(b.dataset.lang); });
  });

  document.getElementById("infoModalClose").addEventListener("click", closeInfoModal);
  document.getElementById("info-modal").addEventListener("click", function (e) {
    if (e.target.id === "info-modal") closeInfoModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("info-modal").classList.contains("hidden")) {
      closeInfoModal();
    }
  });
  document.querySelectorAll(".info-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openInfoModal(btn.getAttribute("data-info-key"));
    });
  });

  if (sessionStorage.getItem("bpc_ok") === "1") {
    unlock();
  } else {
    document.getElementById("gateInput").focus();
  }
</script>
