<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>BP Connect — Page List / ページ一覧</title>
<style>
  :root {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #1d4ed8;
    --brand-soft: #eff6ff;
    --accent: #f59e0b;
    --cat-auth: #6366f1;
    --cat-admin: #1d4ed8;
    --cat-client: #059669;
    --cat-staff: #d97706;
    --cat-shared: #7c3aed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
    font-size: 15px;
  }

  #gate {
    position: fixed; inset: 0; z-index: 2000;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a8a, #0f172a);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #gate .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    text-align: center;
  }
  #gate .logo { font-weight: 800; font-size: 22px; letter-spacing: .2px; color: var(--brand); }
  #gate .logo span { color: var(--accent); }
  #gate p { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
  #gate input {
    width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; outline: none; margin-bottom: 12px;
  }
  #gate input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  #gate button {
    width: 100%; padding: 12px 14px; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--brand); border: none; border-radius: 10px; cursor: pointer;
  }
  #gate button:hover { background: #1742c0; }
  #gateError { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .hidden { display: none !important; }

  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner {
    max-width: 960px; margin: 0 auto; padding: 14px 20px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  }
  .title { font-weight: 800; font-size: 17px; color: var(--brand); }
  .title span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; font-weight: 400; display: block; margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lang-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang-toggle button {
    border: none; background: #fff; color: var(--muted); padding: 8px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--brand); color: #fff; }
  .link-flow {
    font-size: 13px; font-weight: 600; color: var(--brand); text-decoration: none;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .link-flow:hover { background: var(--brand-soft); }

  main { max-width: 960px; margin: 0 auto; padding: 20px; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

  .cat-section { margin-bottom: 28px; }
  .cat-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 2px solid var(--line);
  }
  .cat-badge {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
    padding: 4px 10px; border-radius: 6px; color: #fff; flex-shrink: 0;
  }
  .cat-badge.auth { background: var(--cat-auth); }
  .cat-badge.admin { background: var(--cat-admin); }
  .cat-badge.client { background: var(--cat-client); }
  .cat-badge.staff { background: var(--cat-staff); }
  .cat-badge.shared { background: var(--cat-shared); }
  .cat-title { font-size: 17px; font-weight: 800; margin: 0; }
  .cat-desc { font-size: 13px; color: var(--muted); margin: 2px 0 0; }

  .page-list { display: flex; flex-direction: column; gap: 8px; }
  .page-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; cursor: pointer; text-align: left; width: 100%;
    transition: box-shadow .15s, border-color .15s;
  }
  .page-row:hover { border-color: var(--brand); box-shadow: 0 4px 14px rgba(29,78,216,.12); }
  .page-row:focus { outline: 2px solid var(--brand); outline-offset: 2px; }
  .page-path { font-family: ui-monospace, monospace; font-size: 13px; color: var(--brand); font-weight: 700; }
  .page-name { font-size: 15px; font-weight: 700; margin: 4px 0 0; }
  .page-id { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .page-chev { color: var(--muted); font-size: 18px; flex-shrink: 0; margin-top: 2px; }

  /* Modal */
  #modal-overlay {
    position: fixed; inset: 0; z-index: 1500;
    background: rgba(15,23,42,.55); display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 16px; overflow-y: auto;
  }
  #modal-overlay.hidden { display: none; }
  .modal {
    width: 100%; max-width: 640px; background: var(--panel); border-radius: 16px;
    border: 1px solid var(--line); box-shadow: 0 24px 48px rgba(0,0,0,.2);
    margin: auto 0;
  }
  .modal-head {
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .modal-head h2 { margin: 0; font-size: 18px; line-height: 1.3; }
  .modal-head .sub { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; margin-top: 6px; }
  .modal-close {
    border: none; background: #f1f5f9; color: var(--ink); width: 36px; height: 36px;
    border-radius: 10px; font-size: 20px; line-height: 1; cursor: pointer; flex-shrink: 0;
  }
  .modal-close:hover { background: #e2e8f0; }
  .modal-body { padding: 16px 20px 22px; max-height: min(70vh, 560px); overflow-y: auto; }
  .modal-body p.purpose { margin: 0 0 16px; font-size: 14px; color: var(--ink); }
  .modal-section { margin-bottom: 18px; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section h3 {
    font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 8px; border-left: 3px solid var(--brand); padding-left: 8px;
  }
  .modal-section ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .modal-section li { margin-bottom: 6px; }
  .modal-section code { font-size: 12px; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }

  footer { max-width: 960px; margin: 0 auto; padding: 8px 20px 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">BP <span>Connect</span></div>
    <p>Enter password to view<br />閲覧パスワードを入力してください</p>
    <input id="gateInput" type="password" autocomplete="off" placeholder="Password / パスワード" />
    <button id="gateBtn">View / 表示</button>
    <div id="gateError"></div>
  </div>
</div>

<div id="content" class="hidden">
  <header>
    <div class="header-inner">
      <div>
        <div class="title">BP <span>Connect</span> — <span id="hdr-title"></span></div>
        <span class="subtitle" id="hdr-sub"></span>
      </div>
      <div class="header-actions">
        <a class="link-flow" id="link-flow" href="./bpconnect-flow.html">Page flow / 画面フロー</a>
        <div class="lang-toggle">
          <button type="button" data-lang="ja" class="active">日本語</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <p class="intro" id="intro"></p>
    <div id="categories"></div>
  </main>
  <footer id="foot"></footer>
</div>

<div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h2 id="modal-title"></h2>
        <div class="sub" id="modal-path"></div>
      </div>
      <button type="button" class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

  const UI = {

      foot: "BP Connect — build-spec/04_Webflow_Pages.md に準拠。パスワードはプレビュー用（クライアントサイド）です。",
      categories: {
        auth: { badge: "Auth", title: "認証（全ユーザー）", desc: "ログイン後、権限に応じてトップ画面へ遷移します。" },

      clickHint: "クリックで詳細"
    },
    en: {
      hdrTitle: "Page inventory (spec)",
      hdrSub: "Grouped by role. Click a row to see what goes on that page.",
      intro: "Purpose, forms, blocks, and data sources for each Webflow screen. For client sharing.",

      modalForms: "Forms & inputs",
      modalApi: "Primary APIs / data",
      modalRoles: "Roles with access",
      clickHint: "Click for details"

  };

  const PAGES = [
    {
      category: "auth",
      path: "/login",

      ja: {
        title: "ログイン",
        purpose: "認証し、ロールに応じてトップへ遷移する。",
        blocks: [

          "送信 `wized=\"loginSubmit\"`、エラー `wized=\"loginError\"`、読込 `wized=\"loginLoading\"`"

        forms: ["`email` — ID またはメール", "`password` — パスワード"],
        api: "`POST /auth/login` → 成功後 `POST /auth/me`",

      en: {
        title: "Login",
        purpose: "Authenticate and route to the correct home by role.",
        blocks: [
          "Form `wized-form=\"loginForm\"`",
          "Submit `wized=\"loginSubmit\"`, error `wized=\"loginError\"`, loading `wized=\"loginLoading\"`"
        ],
        forms: ["`email` — ID or email", "`password`"],
        api: "`POST /auth/login` then `POST /auth/me` on success",
        roles: "Everyone (unauthenticated)"
      }
    },
    {
      category: "admin",
      path: "/admin",
      wireframe: "Admin Dashboard",
      ja: {
        title: "管理者ダッシュボード",

        blocks: [

          "進行中案件 `wized-list=\"inProgressCases\"` → 行クリックで `/admin/case`",
          "新着メッセージ `wized-list=\"recentMessages\"` → `/inbox-thread`",
          "取引先・集計・アカウントへのクイックリンク"
        ],
        forms: [],
        api: "`GET /dashboard/admin`",
        roles: "総合管理者、現場責任者"
      },
      en: {
        title: "Admin dashboard",
        purpose: "Operations overview: targets, progress buckets, recent messages, in-progress cases.",
        blocks: [
          "Progress cards `wized=\"progressCards\"`",
          "Targets summary `wized=\"targetsSummary\"`",
          "In-progress list `wized-list=\"inProgressCases\"` → row opens `/admin/case`",
          "Recent messages `wized-list=\"recentMessages\"` → `/inbox-thread`",
          "Quick links to vendors, sales report, accounts"
        ],
        forms: [],
        api: "`GET /dashboard/admin`",
        roles: "super_admin, field_admin"

    {

  let lang = "ja";

  function t(key) {
    return UI[lang][key];
  }

  function catClass(cat) {
    return { auth: "auth", admin: "admin", client: "client", staff: "staff", shared: "shared" }[cat] || "shared";
  }

  function renderCategories() {
    const order = ["auth", "admin", "client", "staff", "shared"];
    const u = UI[lang];
    const root = document.getElementById("categories");
    root.innerHTML = "";
    order.forEach(function (catKey) {
      const cat = u.categories[catKey];
      const section = document.createElement("section");
      section.className = "cat-section";
      const pagesInCat = PAGES.filter(function (p) { return p.category === catKey; });
      section.innerHTML =
        '<div class="cat-head">' +
          '<span class="cat-badge ' + catClass(catKey) + '">' + cat.badge + "</span>" +
          "<div><h2 class=\"cat-title\">" + cat.title + "</h2><p class=\"cat-desc\">" + cat.desc + "</p></div>" +
        "</div>" +
        '<div class="page-list" data-cat="' + catKey + '"></div>';
      const listEl = section.querySelector(".page-list");
      pagesInCat.forEach(function (page, idx) {
        const L = page[lang];
        const row = document.createElement("button");
        row.type = "button";
        row.className = "page-row";
        row.setAttribute("aria-expanded", "false");
        row.innerHTML =
          '<div><div class="page-path">' + page.path + "</div>" +
          '<div class="page-name">' + L.title + "</div>" +
          '<div class="page-id">' + page.wireframe + " · " + u.clickHint + "</div></div>" +
          '<span class="page-chev">›</span>';
        row.addEventListener("click", function () { openModal(page); });
        listEl.appendChild(row);
      });
      root.appendChild(section);
    });
  }

  function openModal(page) {
    const L = page[lang];
    const u = UI[lang];
    document.getElementById("modal-title").textContent = L.title;
    document.getElementById("modal-path").textContent = page.path + " · " + page.wireframe;
    let html = "<p class=\"purpose\"><strong>" + u.modalPurpose + ":</strong> " + L.purpose + "</p>";
    html += sectionHtml(u.modalBlocks, L.blocks);
    if (L.forms && L.forms.length) {
      html += sectionHtml(u.modalForms, L.forms);
    }
    html += "<div class=\"modal-section\"><h3>" + u.modalApi + "</h3><p style=\"margin:0;font-size:14px;\"><code>" + L.api + "</code></p></div>";
    html += "<div class=\"modal-section\"><h3>" + u.modalRoles + "</h3><p style=\"margin:0;font-size:14px;\">" + L.roles + "</p></div>";
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modal-overlay").classList.remove("hidden");
    document.getElementById("modalClose").focus();
  }

  function sectionHtml(heading, items) {
    if (!items || !items.length) return "";
    let h = "<div class=\"modal-section\"><h3>" + heading + "</h3><ul>";
    items.forEach(function (item) {
      h += "<li>" + escapeHtml(item) + "</li>";
    });
    h += "</ul></div>";
    return h;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function closeModal() {
    document.getElementById("modal-overlay").classList.add("hidden");
  }

  function setLang(newLang) {
    lang = newLang;
    document.documentElement.lang = lang;
    document.getElementById("hdr-title").textContent = UI[lang].hdrTitle;
    document.getElementById("hdr-sub").textContent = UI[lang].hdrSub;
    document.getElementById("intro").textContent = UI[lang].intro;
    document.getElementById("foot").textContent = UI[lang].foot;
    document.getElementById("link-flow").textContent = lang === "ja" ? "画面フロー / Page flow" : "Page flow / 画面フロー";
    document.querySelectorAll(".lang-toggle button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    renderCategories();
  }

  function unlock() {
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
    sessionStorage.setItem("bpc_ok", "1");
    setLang("ja");
  }

  function tryUnlock() {
    const val = document.getElementById("gateInput").value.trim();
    if (val === PASSWORD) {
      unlock();
    } else {
      document.getElementById("gateError").textContent = "Incorrect password / パスワードが違います";
      document.getElementById("gateInput").select();
    }
  }

  document.getElementById("gateBtn").addEventListener("click", tryUnlock);
  document.getElementById("gateInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modal-overlay").addEventListener("click", function (e) {
    if (e.target.id === "modal-overlay") closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("modal-overlay").classList.contains("hidden")) {
      closeModal();
    }
  });
  document.querySelectorAll(".lang-toggle button").forEach(function (b) {
    b.addEventListener("click", function () { setLang(b.dataset.lang); });
  });

  if (sessionStorage.getItem("bpc_ok") === "1") {
    unlock();
  } else {
    document.getElementById("gateInput").focus();
  }
</script>
